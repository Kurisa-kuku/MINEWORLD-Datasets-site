name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PUBLIC_REPO_SLUG: ${{ github.repository }}
      PUBLIC_RECORDER_REPO: ${{ vars.MW_RECORDER_REPO || 'Kurisa-kuku/MineWorld-Agent-Recorder' }}
      PUBLIC_GITHUB_OAUTH_CLIENT_ID: ${{ vars.PUBLIC_GITHUB_OAUTH_CLIENT_ID }}
      PUBLIC_GITHUB_AUTH_BASE: ${{ vars.PUBLIC_GITHUB_AUTH_BASE }}
      PUBLIC_ADMIN_LOGINS: ${{ vars.PUBLIC_ADMIN_LOGINS || 'Kurisa-kuku' }}
      PUBLIC_GISCUS_REPO_ID: ${{ vars.PUBLIC_GISCUS_REPO_ID }}
      PUBLIC_GISCUS_CATEGORY_ID: ${{ vars.PUBLIC_GISCUS_CATEGORY_ID }}
      PUBLIC_GISCUS_CATEGORY: ${{ vars.PUBLIC_GISCUS_CATEGORY || 'Announcements' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.28.5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set Pages URL
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER}"
          repo="${GITHUB_REPOSITORY#*/}"
          echo "SITE_URL=https://${owner}.github.io" >> "$GITHUB_ENV"
          if [ "$repo" = "${owner}.github.io" ]; then
            echo "BASE_PATH=" >> "$GITHUB_ENV"
          else
            echo "BASE_PATH=/${repo}" >> "$GITHUB_ENV"
          fi

      - name: Validate dataset catalog
        run: pnpm validate:data

      - name: Build site
        run: pnpm build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
