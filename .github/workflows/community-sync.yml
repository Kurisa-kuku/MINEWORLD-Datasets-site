name: Community stats

on:
  schedule:
    - cron: '41 4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/datasets/**'

permissions:
  contents: write
  issues: write

concurrency:
  group: community-stats
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Ensure community issues and snapshot reactions
        run: node scripts/sync-community.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
